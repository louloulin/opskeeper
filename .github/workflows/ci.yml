name: CI

# Compile + unit-test gate. Exists because regressions like a model field
# rename that left a fakeRepo test using the old API (PR #123 broke
# `go test ./core/manager/biz/edge/...` and sat unnoticed for weeks)
# must fail a PR, not a release build. This job is the fast unit/compile
# layer; the `//go:build e2e` suite runs in the e2e job below.
#
# The e2e suite used to be excluded from this workflow entirely, on the note
# that it "needs docker + a live test environment". Docker is real — MySQL
# comes up through testcontainers — but this runner is a docker host, so the
# stated reason was satisfied by the place the suite was being kept out of.
# Twenty-eight of the thirty e2e tests need nothing but that container and
# about fifty seconds, and they cover the plan's section 6 acceptance end to
# end: login, RBAC, credentials, the gateway streaming to a node credential,
# MCP, workflows, notifications, RCA, the harness.
#
# The build step is the multi-module one, and that is not a detail. go.work is
# gitignored, so CI has no workspace: it resolves the sibling modules and PiG
# through the replace directives and the tags in each go.mod, which is the
# only resolution a release and a node building a plugin on a host will ever
# do. A root-only `go build ./...` used to pass here while the twelve modules
# beneath it were never compiled at all, and while two go.mod files could not
# resolve without the workspace file CI cannot see.

on:
  # Every branch, not just main. This file triggered on `branches: [main]`
  # until decision 165, and because the whole 2.0 line lives on feature/pig
  # with no pull requests open, `gh api .../actions/runs` answered
  # total_count: 0 -- the gate this workflow runs had never executed once
  # (decision 163 added five gates to it; none of them had ever reported).
  # A whitelist of one branch is a promise about where work happens, and this
  # repository does not keep work on main.
  push:
  pull_request:
  # A workflow that can only start on an event somebody else must arrange
  # needs a way to be started on purpose; verifying a fix on a push is one
  # of the two reasons this repository reached 164 with a red gate.
  workflow_dispatch:
  # Nightly, for the delivery job below. The plan's acceptance list ends with
  # "the node holds no cloud vendor key", and that assertion lives in
  # make e2e-delivery-check, which nothing triggered: decision 132 parked it
  # behind the broker container because a registry rate limit must not be able
  # to block a pull request. Parking it is right; leaving it with no schedule
  # at all is not, because a job nothing runs reports on nothing. 03:17 UTC is
  # deliberately off the hour.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  # Keyed on the head branch rather than the ref, so the push run and the
  # pull-request run for the same commit are one run instead of two. Under
  # `github.ref` they are `refs/heads/feature/pig` and `refs/pull/7/merge`
  # and neither cancels the other.
  group: ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + vet + test
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    # SQLite cannot see a dialect difference, which is the whole reason this
    # container is here: the migration list is a list of MySQL statements, and
    # the failure mode that matters — a statement MySQL accepts and SQLite
    # silently tolerates, or the reverse — is invisible until it runs on the
    # engine the deployment actually uses.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: opskeeper
          MYSQL_DATABASE: opskeeper_migtest
          MYSQL_USER: opskeeper
          MYSQL_PASSWORD: opskeeper
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uopskeeper -popskeeper"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AgentTeams protocol contracts
        run: ruby scripts/validate-agentteams-protocols.rb

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: python3 -m pip install -r scripts/requirements-test.txt

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: go vet (root module)
        run: go vet ./...

      - name: Module boundaries
        run: make module-check

      - name: Build and test every module on its own published tags
        run: make module-standalone-check

      - name: Control-plane domain boundaries
        run: make domain-check

      - name: Golden-corpus and diagnostic-axis gates
        run: make eval-gates

      # These five are the plan's phase-2 and phase-3 properties by name:
      # cost crystallisation, the MCP protocol surface, prompt-injection
      # fencing, the audit port, and building a package the way a node builds
      # it. module-standalone-check already ran every one of their tests, so
      # this step is not new coverage — it is the properties being *named* at
      # the point of failure instead of failing as one anonymous package among
      # several hundred, and it is what lets scripts/cigate hold them. Each now
      # builds the way a node builds (cd <module> && GOWORK=off go test), so it
      # also works on a checkout that has no go.work — which the root-relative
      # form did not, on this runner or any fresh clone.
      - name: Audit port is bounded-context free
        run: make audit-port-check

      - name: Crystallization promotion and retirement
        run: make crystallize-check

      - name: MCP protocol surface
        run: make mcp-surface-check

      - name: Foreign text is fenced before it reaches the model
        run: make promptguard-check

      - name: Packaged extensions build the way a node builds them
        run: make plugin-extension-build-check

      # Verified against a real mysql:8.0 before it was wired here, because a
      # migration gate added to CI without ever having been run is a gate that
      # reports a verdict nobody has seen. The target is the whole
      # //go:build integration tag, not the two packages the first version
      # named: the third one had 48 cases that no CI run had ever compiled,
      # and nothing was red, because a build tag removes coverage without
      # removing a line of code. scripts/cigate now asks that per file.
      - name: Everything behind the integration build tag, on the dialect the deployment uses
        env:
          OPSKEEPER_TEST_MYSQL_DSN: opskeeper:opskeeper@tcp(127.0.0.1:3306)/opskeeper_migtest?parseTime=true
        run: make integration-check

      - name: Broker version pins agree
        run: make broker-pin-check

      - name: Node agent is actually offered its package tools
        run: make pig-tool-scoping-check

      - name: Plan acceptance gates are wired
        run: make ci-gate-check

      - name: Verify web console
        run: |
          corepack enable
          cd web
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test

      - name: Verify plugins and open-source gate
        run: make verify-plugins PYTHON=python3

  e2e:
    name: end-to-end suite (${{ matrix.arch }})
    # The plan's section 6 asks for a full end-to-end run on both
    # architectures, and release.yml has been packaging linux/arm64 since it
    # started packaging anything. A release binary built on one architecture and
    # a suite that only ever ran on another is the gap that requirement was
    # written to close, so the suite runs on both now.
    #
    # The arm64 leg is a real run and not a build: ubuntu-24.04-arm is an arm
    # machine, testcontainers pulls the arm64 manifest of mysql:8.0, and the
    # suite compiles and starts the manager natively.
    #
    # What it does NOT cover, stated here so nobody reads more into it than is
    # there: these twenty-eight tests never build the node's pig agent — only
    # make e2e-delivery-check does, and it compiles it from source in
    # core/pig (CGO_ENABLED=0) rather than downloading one. So the arm64 leg
    # is the manager suite on arm, and the node agent on arm is still not
    # exercised anywhere. Closing that would mean matrixing the delivery job
    # too, which puts a public-registry broker pull and a cold PiG build on a
    # second runner for a test nobody has ever run on arm; it is left as the
    # next cut rather than shipped as a red nightly. See decision 186.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # The suite brings up one MySQL container and a manager process per test.
    # Cold it is a pull plus build; warm locally it is under a minute. Twenty
    # minutes is headroom for a cold runner, not an expectation.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      # The two tunnel-broker tests are excluded by name, not by pattern: they
      # pull singchia/frontier from Docker Hub, and a registry rate limit
      # should not take the other twenty-eight with it. make e2e-delivery-check
      # is the target that runs them, and scripts/cigate keeps the excluded set
      # equal to the set of tests that actually call testenv.SharedFrontier.
      - name: End-to-end suite
        run: make e2e-manager-check

  delivery:
    # The plan's acceptance list ends with "the node holds no cloud vendor
    # key", and that assertion has a home — make e2e-delivery-check, which
    # walks the edge's install directory and the process environment of a
    # running pig. It had no schedule: decision 132 parked it because it
    # needs the broker container, and a job nothing triggers is a job that
    # reports on nothing.
    #
    # Nightly rather than per-push, for the same reason it was parked: the
    # broker image comes from a public registry, and a rate limit should not
    # be able to block a pull request. It is allowed to go red here, because
    # a nightly failure is information and a red PR is an obstacle.
    name: node delivery (broker, nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Node delivery and no-cloud-credential assertions
        run: make e2e-delivery-check
