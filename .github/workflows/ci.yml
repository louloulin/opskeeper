name: CI

# Compile + unit-test gate. Exists because regressions like a model field
# rename that left a fakeRepo test using the old API (PR #123 broke
# `go test ./core/manager/biz/edge/...` and sat unnoticed for weeks)
# must fail a PR, not a release build. e2e tests are `//go:build e2e`
# tagged and intentionally excluded here — they need docker + a live test
# environment; this gate is the fast unit/compile layer.
#
# The build step is the multi-module one, and that is not a detail. go.work is
# gitignored, so CI has no workspace: it resolves the sibling modules and PiG
# through the replace directives and the tags in each go.mod, which is the
# only resolution a release and a node building a plugin on a host will ever
# do. A root-only `go build ./...` used to pass here while the twelve modules
# beneath it were never compiled at all, and while two go.mod files could not
# resolve without the workspace file CI cannot see.

on:
  # Every branch, not just main. This file triggered on `branches: [main]`
  # until decision 165, and because the whole 2.0 line lives on feature/pig
  # with no pull requests open, `gh api .../actions/runs` answered
  # total_count: 0 -- the gate this workflow runs had never executed once
  # (decision 163 added five gates to it; none of them had ever reported).
  # A whitelist of one branch is a promise about where work happens, and this
  # repository does not keep work on main.
  push:
  pull_request:
  # A workflow that can only start on an event somebody else must arrange
  # needs a way to be started on purpose; verifying a fix on a push is one
  # of the two reasons this repository reached 164 with a red gate.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed on the head branch rather than the ref, so the push run and the
  # pull-request run for the same commit are one run instead of two. Under
  # `github.ref` they are `refs/heads/feature/pig` and `refs/pull/7/merge`
  # and neither cancels the other.
  group: ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + vet + test
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AgentTeams protocol contracts
        run: ruby scripts/validate-agentteams-protocols.rb

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: python3 -m pip install -r scripts/requirements-test.txt

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: go vet (root module)
        run: go vet ./...

      - name: Module boundaries
        run: make module-check

      - name: Build and test every module on its own published tags
        run: make module-standalone-check

      - name: Control-plane domain boundaries
        run: make domain-check

      - name: Golden-corpus and diagnostic-axis gates
        run: make eval-gates

      - name: Broker version pins agree
        run: make broker-pin-check

      - name: Node agent is actually offered its package tools
        run: make pig-tool-scoping-check

      - name: Plan acceptance gates are wired
        run: make ci-gate-check

      - name: Verify web console
        run: |
          corepack enable
          cd web
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test

      - name: Verify plugins and open-source gate
        run: make verify-plugins PYTHON=python3
