name: sync-pi

# Triggered when an operator pushes a bump commit to `vendor/pi` (or runs
# scripts/sync-pi.sh in CI). Verifies that:
#   - vendor/pi is on the tag pinned by OPSKEEPER_PI_TAG_LOCK
#   - the deny-list at dist/hooks/hooks.yaml is valid YAML and parses
#     against the pi-yaml-hooks schema
#   - scripts/render-pi-system-md.py regenerates SYSTEM.md cleanly
#   - the harness cases in internal/harness/cases/pi pass (gated on
#     Go toolchain being available; skipped with a notice if absent)
#
# Per plan1.0.md G-5, this workflow is the authoritative gate before a
# `bump pi v0.x.y` PR is mergeable.

on:
  push:
    paths:
      - "vendor/pi/**"
      - "dist/hooks/hooks.yaml"
      - "pi-skills/opskeeper-monitor/AGENTS.md"
      - "scripts/sync-pi.sh"
      - ".github/workflows/sync-pi.yml"
      - ".env.example"
  pull_request:
    paths:
      - "vendor/pi/**"
      - "dist/hooks/hooks.yaml"
      - "pi-skills/opskeeper-monitor/AGENTS.md"
      - "scripts/sync-pi.sh"
      - ".github/workflows/sync-pi.yml"
      - ".env.example"
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Override OPSKEEPER_PI_TAG_LOCK for this run"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: sync-pi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-pin:
    name: Pin + hooks YAML + render check
    runs-on: ubuntu-24.04
    env:
      OPSKEEPER_PI_TAG_LOCK: ${{ github.event.inputs.target_tag || 'v0.85.1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"

      - name: Confirm vendored Pi is on ${{ env.OPSKEEPER_PI_TAG_LOCK }}
        run: |
          set -euo pipefail
          actual=$(git -C vendor/pi describe --tags --exact-match HEAD)
          echo "vendor/pi HEAD tag: $actual"
          if [[ "$actual" != "${OPSKEEPER_PI_TAG_LOCK}" ]]; then
            echo "::error::vendor/pi at $actual, expected ${OPSKEEPER_PI_TAG_LOCK}"
            exit 1
          fi

      - name: yamllint dist/hooks/hooks.yaml
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y yamllint
          yamllint -d '{extends: default, rules: {line-length: {max: 180}, document-start: disable, truthy: {check-keys: false}, comments: {min-spaces-from-content: 1}}}' dist/hooks/hooks.yaml

      - name: pi-yaml-hooks YAML load test (best-effort)
        continue-on-error: true
        run: |
          # If pi-yaml-hooks is published to npm, install it and ask it
          # to load the deny-list. If not yet published, this step is
          # a no-op and the harness case in `internal/harness/cases/pi/`
          # covers it once Go is wired.
          set +e
          npm view pi-yaml-hooks version >/dev/null 2>&1
          if [[ $? -eq 0 ]]; then
            npm install --no-save --no-audit --no-fund pi-yaml-hooks js-yaml
            cat > /tmp/load_hooks.cjs <<'NODE_EOF'
              const h = require('pi-yaml-hooks');
              const fs = require('fs');
              const yaml = require('js-yaml');
              const doc = yaml.load(fs.readFileSync('dist/hooks/hooks.yaml', 'utf8'));
              h.validate(doc)
                .then(() => console.log('hooks.yaml OK'))
                .catch((e) => { console.error(e); process.exit(1); });
            NODE_EOF
            node /tmp/load_hooks.cjs
          else
            echo "pi-yaml-hooks not yet on npm; skipping live load test"
          fi

      - name: render-pi-system-md.py --check
        run: |
          python3 scripts/render-pi-system-md.py --check

      - name: shellcheck scripts/sync-pi.sh
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -x -s bash scripts/sync-pi.sh

      - name: python syntax check on render script
        run: |
          python3 -m py_compile scripts/render-pi-system-md.py
